[project]
name = "genai-assignment-2"
version = "0.1.0"
description = "Generative AI assignment 2: criterion-level clinical trial screening."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.10.0",
    "datasets>=3.6.0",
    "fastapi>=0.116.0",
    "matplotlib>=3.10.0",
    "numpy==2.2.6",
    "peft>=0.17.0",
    "pytest>=8.4.0",
    "scikit-learn>=1.7.0",
    "torch>=2.8.0",
    "transformers>=4.56.0",
    "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
